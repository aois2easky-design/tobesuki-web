<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOBESUKI</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, serif; color: #1d2925; background: #f2efe7; }
    body { max-width: 720px; margin: 0 auto; padding: 12vh 24px; }
    main { background: #fffdf6; border: 1px solid #d4ccbb; padding: 40px; box-shadow: 8px 8px 0 #cad8c4; }
    h1 { margin-top: 0; font-size: 3rem; letter-spacing: .04em; }
    p { line-height: 1.7; }
    label { display: block; margin-top: 18px; font-size: .9rem; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 6px; font: inherit; border: 1px solid #aeb8a8; }
    button { margin-top: 24px; color: #fffdf6; background: #28594b; border-color: #28594b; cursor: pointer; }
    #app { display: none; }
    .status { min-height: 1.5em; color: #9b4b37; }
    li { margin: 12px 0; }
  </style>
</head>
<body>
  <main id="login">
    <h1>TOBESUKI</h1>
    <p>HMAC署名で保護されたクエストWeb。</p>
    <form id="login-form">
      <label>ユーザー名<input name="username" autocomplete="username" required></label>
      <label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>
      <button>ログイン</button>
    </form>
    <p class="status" id="login-status"></p>
  </main>
  <main id="app">
    <h1>QUESTS</h1>
    <p id="welcome"></p>
    <ul id="quests"></ul>
    <button id="logout">ログアウト</button>
  </main>
  <script>
    const login = document.querySelector('#login');
    const app = document.querySelector('#app');
    const status = document.querySelector('#login-status');
    async function loadSession() {
      const response = await fetch('/api/me');
      if (!response.ok) return;
        const session = await response.json();
        login.style.display = 'none';
        app.style.display = 'block';
        document.querySelector('#welcome').textContent = session.username + ' さん、ようこそ。';
        const quests = await fetch('/api/quests').then((result) => result.json());
        document.querySelector('#quests').innerHTML = quests.quests.map((quest) => `<li>${quest.title} <small>${quest.status}</small></li>`).join('');
    }
    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const body = Object.fromEntries(new FormData(event.target));
      try {
        const response = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (response.ok) return loadSession();
        status.textContent = (await response.json()).error;
      } catch {
        status.textContent = 'サーバーに接続できません。';
      }
    });
    document.querySelector('#logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      location.reload();
    });
    loadSession();
  </script>
</body>
</html>
