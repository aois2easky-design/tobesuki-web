<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOBESUKI</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, serif; color: #1d2925; background: #f2efe7; }
    body { max-width: 720px; margin: 0 auto; padding: 12vh 24px; }
    main { background: #fffdf6; border: 1px solid #d4ccbb; padding: 40px; box-shadow: 8px 8px 0 #cad8c4; }
    h1 { margin-top: 0; font-size: 3rem; letter-spacing: .04em; }
    p { line-height: 1.7; }
    label { display: block; margin-top: 18px; font-size: .9rem; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 6px; font: inherit; border: 1px solid #aeb8a8; }
    button { margin-top: 24px; color: #fffdf6; background: #28594b; border-color: #28594b; cursor: pointer; }
    #app { display: none; }
    .status { min-height: 1.5em; color: #9b4b37; }
    li { margin: 12px 0; }
  </style>
</head>
<body>
  <main>
    <h1>TOBESUKI</h1>
    <p>TOBESUKIのクエストWeb。誰でもアクセスできます。</p>
    <h2>QUESTS</h2>
    <ul id="quests"></ul>
  </main>
  <script>
    fetch('/api/quests')
      .then((response) => response.json())
      .then((data) => {
        document.querySelector('#quests').innerHTML = data.quests
          .map((quest) => `<li>${quest.title} <small>${quest.status}</small></li>`)
          .join('');
      });
  </script>
</body>
</html>
